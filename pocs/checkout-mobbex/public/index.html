<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace Checkout - Mobbex</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Marketplace Checkout</h1>
            <p>Powered by Mobbex</p>
        </header>

        <div id="status-message" class="status-message"></div>

        <main>
            <section class="products-section">
                <h2>Productos Disponibles</h2>
                <div id="products-list" class="products-grid"></div>
            </section>

            <section class="cart-section">
                <h2>Carrito de Compras</h2>
                <div id="cart-items" class="cart-items"></div>
                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0</span>
                    </div>
                    <div class="summary-row">
                        <span>Comisión Marketplace (5%):</span>
                        <span id="fee">$0</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0</span>
                    </div>
                    <button id="checkout-btn" class="btn-primary" disabled>Proceder al Pago</button>
                </div>
            </section>
        </main>

        <footer>
            <a href="admin.html" class="link">Panel de Administración</a>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
