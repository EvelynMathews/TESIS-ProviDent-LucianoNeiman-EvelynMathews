<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Mobbex Marketplace</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Panel de Administración</h1>
            <p>Gestión de pagos y liberación de fondos - Mobbex</p>
        </header>

        <main>
            <section class="admin-section">
                <h2>Pagos Registrados</h2>
                <div id="payments-list" class="payments-list"></div>
            </section>

            <section class="admin-section">
                <h2>Liberar Fondos Manualmente</h2>
                <div class="release-form">
                    <input
                        type="text"
                        id="payment-id-input"
                        placeholder="ID del Pago"
                        class="input-field"
                    >
                    <button id="release-btn" class="btn-primary">Liberar Fondos</button>
                </div>
                <div id="release-status" class="status-message"></div>
            </section>
        </main>

        <footer>
            <a href="index.html" class="link">Volver al Checkout</a>
        </footer>
    </div>

    <script src="admin.js"></script>
</body>
</html>
